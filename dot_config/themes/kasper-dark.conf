# ─────────────────────────────────────────────────────────────────────────────
# kasper-dark — theme definition for theme-apply
# All hex values in #RRGGBB format
# ─────────────────────────────────────────────────────────────────────────────

# Base colors
bg="#141423"
fg="#E9E9F4"
cursor="#373760"
cursor_text="#F7F7FB"

# 16-color terminal palette
c0="#141423"    # black        (dark background)
c1="#C197FD"    # red-slot     (purple)
c2="#E5C697"    # green-slot   (gold/yellow)
c3="#62D6E8"    # yellow-slot  (cyan)
c4="#20E3B2"    # blue-slot    (teal)
c5="#FF6BCB"    # magenta-slot (pink)
c6="#8BE9FD"    # cyan-slot    (sky blue)
c7="#E9E9F4"    # white        (foreground)

c8="#373760"    # bright-black (dark surface / muted bg)
c9="#C197FD"    # bright-red
c10="#E5C697"   # bright-green
c11="#62D6E8"   # bright-yellow
c12="#20E3B2"   # bright-blue
c13="#FF6BCB"   # bright-magenta
c14="#8BE9FD"   # bright-cyan
c15="#F1F2F8"   # bright-white (near-white text)

c16="#7e7eb5"   # extra: muted/comment color

# ─── Named Color Aliases ───────────────────────────────────────────────────
# Maps a human color name → which cN slot to use when accent="<name>".
# You can also use: accent="c5" or accent="#FF6BCB" directly.

alias_purple="c1"
alias_violet="c1"
alias_gold="c2"
alias_yellow="c2"
alias_cyan="c3"
alias_teal="c4"
alias_green="c4"
alias_pink="c5"
alias_magenta="c5"
alias_sky="c6"
alias_blue="c6"
alias_white="c7"
alias_black="c0"
alias_muted="c16"

# ─── Active Accent ────────────────────────────────────────────────────────
# Options: a name from above, a slot like c5, or a literal hex like #FF6BCB
accent="pink"
