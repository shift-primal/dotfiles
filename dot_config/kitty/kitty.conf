# Kitty config

# Theme
include themes/catppuccin.conf

# Env vars (for opening stuff with keybinds, and zsh doesnt set it automatically)
env EDITOR=nvim
env VISUAL=nvim

enable_audio_bell no
font_size 12.0
window_padding_width 25
cursor_trail 1
confirm_os_window_close 0
cursor_shape block
shell_integration no-cursor
disable_ligatures never

tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

input_delay 0
repaint_delay 2
sync_to_monitor no
wayland_enable_ime no

map XF86Tools send_text all \x1b[25~

map ctrl+shift+enter new_tab_with_cwd
map ctrl+insert copy_to_clipboard

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4

map ctrl+shift+d detach_tab

# BEGIN_KITTY_FONTS
font_family      family="JetBrains Mono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
