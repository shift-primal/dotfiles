# Evondev Dracula — kitty theme
# Matched to Neovim colorscheme:
#   UI colors  → NvChad base46 port (deep blue-purple backgrounds)
#   Syntax/ANSI → official evondev VSCode JSON

background          #141423
foreground          #f8f8f2
cursor              #cfcfcf
cursor_text_color   #141423

selection_background #44475a
selection_foreground #f8f8f2

url_color           #8be9fd

# ── ANSI colors (from evondev VSCode terminal.ansi* values) ─────

# black
color0  #21222c
color8  #8d92ff

# red
color1  #ff5555
color9  #ff6e6e

# green
color2  #20e3b2
color10 #20e3b2

# yellow
color3  #fde181
color11 #eac394

# blue (uses dracula violet — matches nvim ui accents)
color4  #bd93f9
color12 #bd93f9

# magenta
color5  #ff6bcb
color13 #ff6bcb

# cyan
color6  #8be9fd
color14 #2cccff

# white
color7  #f8f8f2
color15 #ffffff

