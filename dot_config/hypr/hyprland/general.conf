# Theme variables
$GTK_THEME = Rose-Pine
$ICON_THEME = Tela-circle-pink
$COLOR_SCHEME = prefer-dark

# Rules
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = $accent
    col.inactive_border = $background
    layout = dwindle
    resize_on_border = false
}

decoration {
    rounding = 20
    rounding_power = 2

  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }

    blur {
        enabled = yes
        size = 3
        passes = 2
		vibrancy = 0.1696
        noise = 0.1
        new_optimizations = on
        ignore_opacity = false
        xray = false
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

animations {
    enabled = 1

    bezier = default, 0.12, 0.92, 0.08, 1.0
    bezier = wind, 0.12, 0.92, 0.08, 1.0
    bezier = overshot, 0.18, 0.95, 0.22, 1.03
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 4, wind, popin 60%
    animation = windowsIn, 1, 5, overshot, popin 60%
    animation = windowsOut, 1, 3, overshot, popin 60%
    animation = windowsMove, 1, 3, overshot, slide
    animation = layers, 1, 3, default, popin
    animation = fadeIn, 1, 4, default
    animation = fadeOut, 1, 4, default
    animation = fadeSwitch, 1, 6, default
    animation = fadeShadow, 1, 6, default
    animation = fadeDim, 1, 6, default
    animation = fadeLayers, 1, 6, default
    animation = workspaces, 1, 4, overshot, slidevert
    animation = border, 1, 1, liner
    animation = borderangle, 1, 100, liner, loop
}
