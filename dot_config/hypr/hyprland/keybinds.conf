### VARIABLES ###

# Script path
$scrPath = ~/user_scripts

# Assign modifier
$mainMod = Super

# Assign apps
$TERMINAL = kitty
$ALT_TERMINAL = alacritty
$EDITOR = nvim
$SYSMONITOR = btop
$EXPLORER = yazi
$BROWSER = firefox
$DISCORD = equibop
$EMAIL = betterbird
$STEAM = steam
$SPOTIFY = spotify_player
$LOCKSCREEN = hyprlock

# Assign menus
$APPLAUNCHER = $scrPath/rofi/launch-apps.sh
$KEYBINDSMENU = $scrPath/rofi/launch-keybindings.sh
$POWERMENU = $scrPath/rofi/launch-power-menu.sh
$SCREENSHOTMENU = $scrPath/rofi/launch-screenshot-menu.sh
$CLIPBOARD = $scrPath/rofi/launch-cliphist.sh
$RESTARTMENU = $scrPath/rofi/launch-restart-menu.sh

# Assign scripts
$COLORPICKER = $scrPath/hyprland/colorpicker.sh
$CYCLEWALLPAPER = $scrPath/awww/cycle-wallpaper.sh
$VOLUME = $scrPath/hyprland/volume.sh
$MICROPHONE = $scrPath/hyprland/microphone.sh
$HYPRCAP = $scrPath/hyprland/hyprcap.sh
$SWITCHPROFILE = $scrPath/hyprland/hypr-profile-switch.sh

### HYRPLAND WINDOWS ###

# Manage windows
bindd = $mainMod, W, Close window (focused), killactive
bindd = $mainMod, T, Toggle floating window (focused), togglefloating
bindd = $mainMod, F, Toggle fullscreen window (focused), fullscreen

# Manage focus
bindd = $mainMod, Left, Move focus left, movefocus, l
bindd = $mainMod, Right, Move focus right , movefocus, r
bindd = $mainMod, Up, Move focus up , movefocus, u
bindd = $mainMod, Down , Move focus down, movefocus, d
bindd = ALT, Tab, Cycle focus forward, cyclenext
bindd = SHIFT ALT, Tab, Cycle Focus back, cyclenext, prev

# Manage focus (Vim Bindings)
bindd = $mainMod, h, Move focus left, movefocus, l
bindd = $mainMod, l, Move focus right , movefocus, r
bindd = $mainMod, k, Move focus up , movefocus, u
bindd = $mainMod, j, Move Focus down, movefocus, d

# Move
bindd = $mainMod Shift, left, Move focused window left, movewindow, l
bindd = $mainMod Shift, right, Move focused window right, movewindow, r
bindd = $mainMod Shift, up, Move focused window up, movewindow, u
bindd = $mainMod Shift, down, Move focused window down, movewindow, d

# Move (Vim Bindings)
bindd = $mainMod Shift, h, Move focused window left, movewindow, l
bindd = $mainMod Shift, l, Move focused window right, movewindow, r
bindd = $mainMod Shift, k, Move focused window up, movewindow, u
bindd = $mainMod Shift, j, Move focused window down, movewindow, d

# Resize
binddm = $mainMod, mouse:272, Hold to move window, movewindow
binddm = $mainMod, mouse:273, Hold to resize window, resizewindow
binddm = $mainMod, X, Hold to move window , movewindow
binddm = $mainMod, Z, Hold To resize window, resizewindow

# Layout
bindd = $mainMod, G, Toggle Split Viewing, layoutmsg, togglesplit
bindd = $mainMod Ctrl, G, Toggle Split View, layoutmsg, swapsplit

# Navigation
bindd = $mainMod, 1, Navigate to workspace 1 , workspace, 1
bindd = $mainMod, 2, Navigate to workspace 2 , workspace, 2
bindd = $mainMod, 3, Navigate to workspace 3 , workspace, 3
bindd = $mainMod, 4, Navigate to workspace 4 , workspace, 4
bindd = $mainMod, 5, Navigate To Workspace 5 , Workspace, 5

# Move focused window
bindd = $mainMod Shift, 1, Move to workspace 1 , movetoworkspace, 1
bindd = $mainMod Shift, 2, Move to workspace 2 , movetoworkspace, 2
bindd = $mainMod Shift, 3, Move to workspace 3 , movetoworkspace, 3
bindd = $mainMod Shift, 4, Move to workspace 4 , movetoworkspace, 4
bindd = $mainMod Shift, 5, Move To Workspace 5 , Movetoworkspace, 5

# Move focused window (silent)
bindd = $mainMod Alt, 1, Move to workspace 1  (silent), movetoworkspacesilent, 1
bindd = $mainMod Alt, 2, Move to workspace 2  (silent), movetoworkspacesilent, 2
bindd = $mainMod Alt, 3, Move to workspace 3  (silent), movetoworkspacesilent, 3
bindd = $mainMod Alt, 4, Move to workspace 4  (silent), movetoworkspacesilent, 4
bindd = $mainMod Alt, 5, Move To Workspace 5  (silent), Movetoworkspacesilent, 5

# Launch menus
bindd = $mainMod, Space, Show app launcher (rofi), exec, $APPLAUNCHER
bindd = $mainMod, Escape, Show power menu, exec, $POWERMENU
bindd = $mainMod Ctrl, K, Show keybindings menu, exec, $KEYBINDSMENU
bindd = $mainMod Shift, R, Show restart menu, exec, $RESTARTMENU
bindd = $mainMod Shift, S, Show recording menu, exec, $SCREENSHOTMENU
bindd = $mainMod Shift, V, Show clipboard history, exec, $CLIPBOARD

# Launch apps
bindd = $mainMod, Return, Open terminal emulator , exec, $TERMINAL
bindd = $mainMod Shift, Return, Open secondary terminal emulator, exec, $ALT_TERMINAL
bindd = $mainMod Shift, Escape, Open system monitor, exec, kitty -e $SYSMONITOR
bindd = $mainMod Shift, F, Open file explorer , exec, kitty -e $EXPLORER
bindd = $mainMod Shift, N, Open text editor , exec, kitty -e $EDITOR
bindd = $mainMod Shift, B, Open web browser , exec, $BROWSER
bindd = $mainMod Shift, D, Open Discord, exec, $DISCORD
bindd = $mainMod Shift, E, Open Email, exec, $EMAIL
bindd = $mainMod Shift, G, Open Steam, exec, $STEAM
bindd = $mainMod Shift, M, Open Spotify, exec, kitty -e $SPOTIFY

# Discord

bindd = $mainMod, XF86AudioMute, Mute microphone, exec, $DISCORD --toggle-mic
bindd = $mainMod Shift, XF86AudioMute, Deafen Discord, exec, $DISCORD --toggle-deafen

# System utils
bindd = SUPER, C, Universal copy, sendshortcut, CTRL, Insert,
bindd = SUPER, V, Universal paste, sendshortcut, SHIFT, Insert,
bindd = SUPER, X, Universal cut, sendshortcut, CTRL, X,

bindd = $mainMod, Backspace, Lock screen, exec, $LOCKSCREEN
bindd = $mainMod Shift, C, Color picker, exec, $COLORPICKER
bindd = $mainMod Shift, W, Cycle Wallpaper, exec, $CYCLEWALLPAPER
bindd = Ctrl Alt, Delete, Restart SDDM, exec, sudo systemctl restart sddm

bindd = $mainMod, S, Screenshot region, exec, $HYPRCAP ss
bindd = $mainMod, R, Record region, exec, $HYPRCAP rec
bindd = $mainMod, P, Switch profile, exec, $SWITCHPROFILE

# Audio (Volume)
bindd = , XF86AudioRaiseVolume, Increase volume, exec, $VOLUME up
bindd = , XF86AudioLowerVolume, Decrease volume, exec, $VOLUME down
bindd = , XF86AudioMute, Mute volume, exec, $VOLUME mute

# Audio (Microphone)
bindd = $mainMod, XF86AudioRaiseVolume, Increase microphone volume, exec, $MICROPHONE up
bindd = $mainMod, XF86AudioLowerVolume, Decrease microphone volume, exec, $MICROPHONE down

# Spotify
bindd = $mainMod Alt, Left, spotify prev song, exec, spotify_player playback previous
bindd = $mainMod Alt, Right, spotify next song, exec, spotify_player playback next
bindd = $mainMod Alt, Space, spotify play/pause song, exec, spotify_player playback play-pause
