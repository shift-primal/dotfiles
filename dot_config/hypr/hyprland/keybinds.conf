# Assign variables
$ipc = qs -c noctalia-shell ipc call
$mainMod = SUPER

# Assign apps
$TERMINAL = kitty
$ALT_TERMINAL = alacritty
$EDITOR = nvim
$SYSMONITOR = btop
$EXPLORER = yazi
$BROWSER = firefox
$DISCORD = equibop
$EMAIL = betterbird
$SPOTIFY = spotify_player

### NOCTALIA SHELL ###

# Core binds
bind = $mainMod, SPACE, exec, $ipc launcher toggle #"Noctalia launcher"
bind = $mainMod, ESCAPE, exec, $ipc controlCenter toggle #"Noctalia control center"
bind = $mainMod, COMMA, exec, $ipc settings toggle #"Noctalia settings panel"

# Media keys
bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase #"Raise volume"
bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease #"Lower volume"
bindl = , XF86AudioMute, exec, $ipc volume muteOutput #"Mute volume"
bindl = $mainMod ALT, LEFT, exec, $ipc media previous #"Previous song"
bindl = $mainMod ALT, RIGHT, exec, $ipc media next #"Next song"
bindl = $mainMod ALT, SPACE, exec, $ipc media playPause #"Play/pause song"

# System utils
bindel = , XF86MonBrightnessUP, exec, $ipc brightness increase #"Raise brightness"
bindel = , XF86MonBrightnessDOWN, exec, $ipc brightness decrease #"Lower brightness"
bind = $mainMod, P, exec, $ipc plugin:screen-shot-and-record screenshot #"Screenshot region"
bind = $mainMod, R, exec, $ipc plugin:screen-shot-and-record recordsound #"Record region"
bind = $mainMod SHIFT, L, exec, $ipc lockScreen lock #"Lock computer"
bindd = SUPER, C, Universal copy, sendshortcut, CTRL, Insert,
bindd = SUPER, V, Universal paste, sendshortcut, SHIFT, Insert,
bindd = SUPER, X, Universal cut, sendshortcut, CTRL, X,

# Launch Noctalia menus
bind = $mainMod, B, exec, $ipc plugin:keybind-cheatsheet toggle #"Keybind cheatsheet"
bind = $mainMod, S, exec, $ipc plugin:screen-toolkit toggle #"Screen toolkit"
bind = $mainMod SHIFT, C, exec, $ipc plugin:screen-toolkit colorPicker #"Color picker"
bind = $mainMod, M, exec, $ipc plugin:screen-toolkit measure #"Measure screen"
bind = $mainMod, Y, exec, $ipc launcher clipboard #"Clipboard history"
bind = $mainMod, E, exec, $ipc launcher emoji #"Emojis"
bind = $mainMod, DELETE, exec, $ipc systemMonitor toggle #"System monitor"
bind = CTRL ALT, DELETE, exec, $ipc sessionMenu toggle #"Power menu"

# Launch apps
bind = $mainMod, RETURN, exec, $TERMINAL #"Terminal emulator"
bind = $mainMod SHIFT, RETURN, exec, $ALT_TERMINAL #"Terminal emulator (ALT)"
bind = $mainMod SHIFT, ESCAPE, exec, kitty -e $SYSMONITOR #"System monitor"
bind = $mainMod SHIFT, F, exec, kitty -e $EXPLORER #"File explorer"
bind = $mainMod SHIFT, N, exec, kitty -e $EDITOR #"Text editor"
bind = $mainMod SHIFT, B, exec, $BROWSER #"Web browser"
bind = $mainMod SHIFT, D, exec, $DISCORD #"Discord"
bind = $mainMod SHIFT, E, exec, $EMAIL #"Email"
bind = $mainMod SHIFT, G, exec, $STEAM #"Steam"
bind = $mainMod SHIFT, M, exec, kitty -e $SPOTIFY #"Spotify"

# Discord
bind = $mainMod, XF86AudioMute, exec, $DISCORD --toggle-mic #"Toggle microphone (Discord)"
bind = $mainMod SHIFT, XF86AudioMute, exec, $DISCORD --toggle-deafen #"Toggle deafen (Discord)"

### HYRPLAND WINDOWS ###

# Manage windows
bind = $mainMod, W, killactive #"Close window (focused)"
bind = $mainMod, T, togglefloating #"Toggle floating window (focused)"
bind = $mainMod, F, fullscreen #"Toggle fullscreen window (focused)"

# Manage focus
bind = $mainMod, LEFT, movefocus, l #"Move focus left"
bind = $mainMod, H, movefocus, l #"Move focus left (Vim bind)"

bind = $mainMod, RIGHT, movefocus, r #"Move focus right"
bind = $mainMod, L, movefocus, r #"Move focus right (Vim bind)"

bind = $mainMod, UP, movefocus, u #"Move focus up"
bind = $mainMod, K, movefocus, u #"Move focus up (Vim bind)"

bind = $mainMod, DOWN , movefocus, d #"Move focus down"
bind = $mainMod, J, movefocus, d #"Move focus down (Vim bind)"

bind = ALT, Tab, cyclenext #"Cycle focus forward"
bind = SHIFT ALT, Tab, cyclenext, prev #"Cycle Focus back"

# Move
bind = $mainMod SHIFT, LEFT, movewindow, l #"Move focused window left"
bind = $mainMod SHIFT, H, movewindow, l #"Move focused window left"
bind = $mainMod SHIFT, RIGHT, movewindow, r #"Move focused window right"
bind = $mainMod SHIFT, L, movewindow, r #"Move focused window right"
bind = $mainMod SHIFT, UP, movewindow, u #"Move focused window up"
bind = $mainMod SHIFT, K, movewindow, u #"Move focused window up"
bind = $mainMod SHIFT, DOWN, movewindow, d #"Move focused window down"
bind = $mainMod SHIFT, J, movewindow, d #"Move focused window down"

# Resize
bindm = $mainMod, mouse:272, movewindow #"Hold to move window"
bindm = $mainMod, mouse:273, resizewindow #"Hold to resize window"

# Layout
bind = $mainMod, G, layoutmsg, togglesplit #"Toggle Split Viewing"
bind = $mainMod CTRL, G, layoutmsg, swapsplit #"Toggle Split View"

# Navigation
bind = $mainMod, 1, workspace, 1 #"Navigate to workspace 1"
bind = $mainMod, 2, workspace, 2 #"Navigate to workspace 2"
bind = $mainMod, 3, workspace, 3 #"Navigate to workspace 3"
bind = $mainMod, 4, workspace, 4 #"Navigate to workspace 4"
bind = $mainMod, 5, Workspace, 5 #"Navigate To Workspace 5"

# Move focused window (Workspace)
bind = $mainMod SHIFT, 1, movetoworkspace, 1 #"Move to workspace 1"
bind = $mainMod SHIFT, 2, movetoworkspace, 2 #"Move to workspace 2"
bind = $mainMod SHIFT, 3, movetoworkspace, 3 #"Move to workspace 3"
bind = $mainMod SHIFT, 4, movetoworkspace, 4 #"Move to workspace 4"
bind = $mainMod SHIFT, 5, Movetoworkspace, 5 #"Move To Workspace 5"
