### VARIABLES ###

# Script path
$scrPath = ~/user_scripts

# Super -> Modifier
$mainMod = Super # super / meta / windows key

# Assign apps
$TERMINAL = kitty
$EDITOR = nvim
$EXPLORER = nautilus
$BROWSER = firefox
$DISCORD = equibop
$EMAIL = betterbird
$STEAM = steam

# Assign scripts
$KEYBINDSMENU = $scrPath/rofi/launch-keybindings.sh
$APPLAUNCHER = $scrPath/rofi/launch-apps.sh
$POWERMENU = $scrPath/rofi/launch-power-menu.sh
$SCREENSHOTMENU = $scrPath/rofi/launch-screenshot-menu.sh
$CLIPHIST = $scrPath/rofi/launch-cliphist.sh
$COLORPICKER = $scrPath/hyprland/colorpicker.sh
$CYCLEWALLPAPER = $scrPath/awww/cycle-wallpaper.sh
$VOLUME = $scrPath/hyprland/volume.sh

### HYRPLAND WINDOWS ###

# Manage windows
bindd = $mainMod, W, $d Close window (focused), killactive
bindd = $mainMod, T, $d Toggle floating window (focused), togglefloating
bindd = $mainMod, F, $d Toggle fullscreen window (focused), fullscreen
bindd = $mainMod, Escape, $d Open Power Menu, exec, $scrPath/logoutlaunch.sh

# Manage focus
bindd = $mainMod, Left, $d Move focus left, movefocus, l
bindd = $mainMod, Right, $d Move focus right , movefocus, r
bindd = $mainMod, Up, $d Move focus up , movefocus, u
bindd = $mainMod, Down , $d Move focus down, movefocus, d
bindd = ALT, Tab,$d Cycle focus forward, cyclenext
bindd = SHIFT ALT, Tab, $d Cycle focus back, cyclenext, prev

# Move
bindd = $mainMod Shift, left, Move focused window left, movewindow, l
bindd = $mainMod Shift, right, Move focused window right, movewindow, r
bindd = $mainMod Shift, up, Move focused window up, movewindow, u
bindd = $mainMod Shift, down, Move focused window down, movewindow, d

# Resize
binddm = $mainMod, mouse:272, $d Hold to move window, movewindow
binddm = $mainMod, mouse:273, $d Hold to resize window, resizewindow
binddm = $mainMod, X, $d Hold to move window , movewindow
binddm = $mainMod, Z, $d Hold to resize window, resizewindow

# Etc
bindd = $mainMod, J, $d Toggle split viewing, togglesplit
bindd = $mainMod Shift, R, $d Toggle / restart waybar, exec, killall waybar && sleep 1 && waybar
bindd = $mainMod Shift, W, $d Cycle wallpaper, exec, $CYCLEWALLPAPER

### HYPRLAND WORKSPACES ###

# Navigation
bindd = $mainMod, 1, $d navigate to workspace 1 , workspace, 1
bindd = $mainMod, 2, $d navigate to workspace 2 , workspace, 2
bindd = $mainMod, 3, $d navigate to workspace 3 , workspace, 3
bindd = $mainMod, 4, $d navigate to workspace 4 , workspace, 4
bindd = $mainMod, 5, $d navigate to workspace 5 , workspace, 5
bindd = $mainMod, 6, $d navigate to workspace 6 , workspace, 6
bindd = $mainMod, 7, $d navigate to workspace 7 , workspace, 7
bindd = $mainMod, 8, $d navigate to workspace 8 , workspace, 8
bindd = $mainMod, 9, $d navigate to workspace 9 , workspace, 9
bindd = $mainMod, 0, $d navigate to workspace 10 , workspace, 10

# Move focused window
bindd = $mainMod Shift, 1, $d move to workspace 1 , movetoworkspace, 1
bindd = $mainMod Shift, 2, $d move to workspace 2 , movetoworkspace, 2
bindd = $mainMod Shift, 3, $d move to workspace 3 , movetoworkspace, 3
bindd = $mainMod Shift, 4, $d move to workspace 4 , movetoworkspace, 4
bindd = $mainMod Shift, 5, $d move to workspace 5 , movetoworkspace, 5
bindd = $mainMod Shift, 6, $d move to workspace 6 , movetoworkspace, 6
bindd = $mainMod Shift, 7, $d move to workspace 7 , movetoworkspace, 7
bindd = $mainMod Shift, 8, $d move to workspace 8 , movetoworkspace, 8
bindd = $mainMod Shift, 9, $d move to workspace 9 , movetoworkspace, 9
bindd = $mainMod Shift, 0, $d move to workspace 10 , movetoworkspace, 10

# Move focused window (silent)
bindd = $mainMod Alt, 1, $d move to workspace 1  (silent), movetoworkspacesilent, 1
bindd = $mainMod Alt, 2, $d move to workspace 2  (silent), movetoworkspacesilent, 2
bindd = $mainMod Alt, 3, $d move to workspace 3  (silent), movetoworkspacesilent, 3
bindd = $mainMod Alt, 4, $d move to workspace 4  (silent), movetoworkspacesilent, 4
bindd = $mainMod Alt, 5, $d move to workspace 5  (silent), movetoworkspacesilent, 5
bindd = $mainMod Alt, 6, $d move to workspace 6  (silent), movetoworkspacesilent, 6
bindd = $mainMod Alt, 7, $d move to workspace 7  (silent), movetoworkspacesilent, 7
bindd = $mainMod Alt, 8, $d move to workspace 8  (silent), movetoworkspacesilent, 8
bindd = $mainMod Alt, 9, $d move to workspace 9  (silent), movetoworkspacesilent, 9
bindd = $mainMod Alt, 0, $d move to workspace 10 (silent), movetoworkspacesilent, 10

### APPS ###

# Launch
bindd = $mainMod, K, $d Show keybindings menu, exec, $KEYBINDSMENU
bindd = $mainMod, Space, $d open app launcher rofi, exec, $APPLAUNCHER
bindd = $mainMod, Escape, $d open power menu, exec, $POWERMENU
bindd = $mainMod, S, $d Open screencap menu, exec, $SCREENSHOTMENU
bindd = $mainMod, V, $d open cliphist, exec, $CLIPHIST
bindd = $mainMod, Return, $d terminal emulator , exec, $TERMINAL

bindd = $mainMod Shift, F, $d file explorer , exec, $EXPLORER
bindd = $mainMod Shift, N, $d text editor , exec, $EDITOR
bindd = $mainMod Shift, B, $d web browser , exec, $BROWSER
bindd = $mainMod Shift, D, $d discord, exec, $DISCORD
bindd = $mainMod Shift, E, $d open email, exec, $EMAIL
bindd = $mainMod Shift, S, $d open steam, exec, $STEAM


# Discord
bindd = $mainMod, XF86AudioMute, $d toggle mute mic, exec, equibop --toggle-mic
bindd = $mainMod Shift, XF86AudioMute, $d deafen discord, exec, equibop --toggle-deafen

# System utils
bindd = $mainMod, L, $d lock screen, exec, hyprlock
bindd = $mainMod Shift, C, $d color picker, exec, $COLORPICKER

# Audio
bindd = , XF86AudioRaiseVolume, $d increase volume, exec, $VOLUME up
bindd = , XF86AudioLowerVolume, $d decrease volume, exec, $VOLUME down
bindd = , XF86AudioMute, $d mute volume, exec, $VOLUME mute

# Spotify
bindd = $mainMod Alt, Return, $d open spotify_player, exec, kitty -e spotify_player
bindd = $mainMod Alt, Left, $d spotify prev song, exec, spotify_player playback previous
bindd = $mainMod Alt, Right, $d spotify next song, exec, spotify_player playback next
bindd = $mainMod Alt, Space, $d spotify play/pause song, exec, spotify_player playback play-pause
