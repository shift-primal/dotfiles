### IMPORT ###
source = colors.conf
$scrPath = ~/user_scripts

### SCRIPTS ###

$MUSICINFO = $scrPath/hyprlock/songdetail.sh

# General
general {
    grace = 1
    fractional_scaling = 2
    ignore_empty_input = true
}

# BG
background {
    monitor =
    path = $HOME/wallpapers/current.png
    color = $background
    blur_size = 3
    blur_passes = 2
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.6000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}


# Hours
label {
    monitor = DP-1
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = $on_secondary_container
    font_size = 112
    font_family = Adwaita Sans
    shadow_passes = 0
    shadow_size = 0
    position = 0, 220
    halign = center
    valign = center
}

# Minutes
label {
    monitor = DP-1
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = $on_secondary_container
    font_size = 112
    font_family = Adwaita Sans
    shadow_passes = 0
    shadow_size = 0
    position = 0, 80
    halign = center
    valign = center
}

# Day
label {
    monitor = DP-1
    text = cmd[update:18000000] echo "<b><big> "$(date +'%A')" </big></b>"
    color = $secondary
    font_size = 18
    font_family = 0xProto Nerd Font

    position = 0, -25
    halign = center
    valign = center
}

# Week
label {
    monitor = DP-1
    text = cmd[update:18000000] echo "<b> "$(date +'%d %b')" </b>"
    color = $secondary
    font_size = 14
    font_family = 0xProto Nerd Font
    position = 0, -50
    halign = center
    valign = center
}

# Music
label {
    monitor = DP-1
    text = cmd[update:1000] echo "$($MUSICINFO)"
    color = $secondary
    font_size = 14
    font_family = 0xProto Nerd Font
    position = 0, -150
    halign = center
    valign = center
}

